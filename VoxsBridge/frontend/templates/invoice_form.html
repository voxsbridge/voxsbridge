{% extends "base.html" %}{% block title %}Create Invoice — VoxsBridge{% endblock %}{% block content %}<style>
.cm-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0 24px;gap:15px}.cm-head h1{font-size:27px;margin:0}.cm-muted{color:var(--text-secondary,#8893a9)}.cm-card{background:var(--surface,#1b2030);border:1px solid var(--border,#31384b);border-radius:17px;padding:24px;margin-bottom:18px;color:var(--text-primary,#eaf0ff)}.cm-table{width:100%;border-collapse:collapse}.cm-table th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-secondary,#8893a9);padding:14px}.cm-table td{padding:15px 14px;border-top:1px solid var(--border,#31384b)}.cm-table small{display:block;color:var(--text-secondary,#8893a9);margin-top:4px}.cm-pill{display:inline-block;padding:5px 10px;border-radius:30px;background:rgba(37,99,255,.14);color:#6fb0ff;font-size:12px;font-weight:700}.cm-ok{color:#10b981;background:rgba(16,185,129,.12)}.cm-warn{color:#f59e0b;background:rgba(245,158,11,.12)}.cm-danger{color:#f87171;background:rgba(248,113,113,.12)}.cm-btn{background:#2563ff;color:white;border:0;border-radius:9px;padding:11px 17px;text-decoration:none;display:inline-block;cursor:pointer;font-weight:600}.cm-btn-alt{background:var(--surface-secondary,#242b3d);color:var(--text-primary,#eef);border:1px solid var(--border,#394155)}.cm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.cm-field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.cm-field label{font-size:12px;color:var(--text-secondary,#9da7bb)}.cm-field input,.cm-field select,.cm-field textarea{background:var(--surface-secondary,#252c3d);color:var(--text-primary,#f5f7ff);border:1px solid var(--border,#394155);border-radius:9px;padding:12px;width:100%;box-sizing:border-box}.cm-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.cm-metric{background:var(--surface-secondary,#252c3d);border-radius:12px;padding:18px}.cm-metric strong{display:block;font-size:20px}.cm-metric small{color:var(--text-secondary,#99a5bb)}.cm-hero{background:linear-gradient(105deg,#10172b,#10306e,#162a55);color:white;border-radius:18px;padding:24px;margin-bottom:20px}.cm-overlay{position:fixed;inset:0;background:#0008;z-index:200;display:none}.cm-overlay.open{display:block}.cm-drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);overflow:auto;background:var(--surface,#1c2436);color:var(--text-primary,#fff);z-index:201;padding:25px;box-sizing:border-box;transform:translateX(100%);transition:transform .2s;border-left:1px solid var(--border,#394155)}.cm-drawer.open{transform:translateX(0)}.cm-actions{display:flex;flex-wrap:wrap;gap:9px}.cm-actions form{display:inline}.cm-scroll{overflow:auto}.cm-drawer .cm-metrics{grid-template-columns:repeat(2,1fr)}@media(max-width:850px){.cm-grid,.cm-metrics{grid-template-columns:1fr 1fr}.cm-table{min-width:760px}}@media(max-width:550px){.cm-grid,.cm-metrics{grid-template-columns:1fr}}
</style><div class="cm-head"><div><h1>Create Invoice</h1><p class="cm-muted">Contact us for payment</p></div><a href="/invoices">← Invoices</a></div><form method="post" action="/invoices/new" class="cm-card"><div class="cm-grid"><div class="cm-field"><label>Customer Email (existing customer)</label><input name="customer_email" type="email" required value="{{ customer.email if customer else '' }}"></div><div class="cm-field"><label>Customer Name</label><input readonly value="{{ customer.name if customer else 'Loaded from selected customer' }}"></div><div class="cm-field"><label>Issue Date</label><input type="date" name="issue_date" id="issued" required></div><div class="cm-field"><label>Due Date</label><input type="date" name="due_date" id="due" required></div></div><h2>Invoice Items</h2><div id="items"><div class="cm-grid invoice-item"><div class="cm-field"><label>Description</label><input name="description" value="{{ customer.plan_name if customer else '' }}" required></div><div class="cm-grid"><div class="cm-field"><label>Quantity</label><input type="number" name="qty" min="1" value="1" required></div><div class="cm-field"><label>Unit Price (PKR)</label><input type="number" name="unit_price" min="0" value="{{ customer.last_paid_amount if customer else 0 }}" required></div></div></div></div><button type="button" class="cm-btn cm-btn-alt" onclick="addLine()">+ Add Line</button><div class="cm-grid" style="margin-top:18px"><div><div class="cm-field"><label>Notes</label><textarea name="notes" rows="4"></textarea></div><div class="cm-field"><label>Terms</label><textarea name="terms" rows="3">Payment is due by the due date shown. Contact us for payment.</textarea></div></div><div><div class="cm-field"><label>Discount (PKR)</label><input type="number" min="0" name="discount" id="discount" value="0"></div><div class="cm-field"><label>Tax (%)</label><input type="number" min="0" max="100" name="tax_percent" id="tax" value="0"></div><div class="cm-metric"><small>Total (PKR)</small><strong id="grandTotal">0</strong></div></div></div><div class="cm-actions" style="margin-top:20px"><button class="cm-btn" name="action" value="preview">Save & Preview</button><button class="cm-btn cm-btn-alt" name="action" value="save">Save</button></div></form><script>(function(){const today=new Date();const fmt=d=>d.toISOString().slice(0,10);document.getElementById('issued').value=fmt(today);let due=new Date(today);due.setDate(due.getDate()+3);document.getElementById('due').value=fmt(due);function addLine(){const node=document.querySelector('.invoice-item').cloneNode(true);node.querySelector('[name=description]').value='';node.querySelector('[name=qty]').value=1;node.querySelector('[name=unit_price]').value=0;document.getElementById('items').append(node);calc()}function calc(){let sub=0;document.querySelectorAll('.invoice-item').forEach(row=>sub+=Number(row.querySelector('[name=qty]').value||0)*Number(row.querySelector('[name=unit_price]').value||0));const disc=Number(document.getElementById('discount').value||0);const tax=Number(document.getElementById('tax').value||0);document.getElementById('grandTotal').textContent=Math.round(Math.max(0,sub-disc)*(1+tax/100)).toLocaleString()}window.addLine=addLine;window.calc=calc;document.querySelector('form').addEventListener('input',calc);calc()})();</script>{% endblock %}
